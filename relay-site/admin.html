<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Relay admin</title>
<style>
:root{--bg:#f6efe7;--card:#fffaf4;--ink:#1a1a1a;--muted:#6b6258;--line:#e0d0bf;--o:#f3701e;--s:#4b607f}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.w{max-width:1100px;margin:0 auto;padding:24px 16px 60px}h1{margin:0 0 4px;font-size:26px}.sub{color:var(--muted);margin:0 0 22px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}.c b{display:block;font-size:26px;letter-spacing:-.02em}.c span{font-size:12px;color:var(--muted)}
.c.o{background:var(--o)}.c.o span{color:#3a2412}
input,button{font:inherit}input{padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-width:220px}button{padding:9px 16px;border:0;border-radius:999px;background:var(--ink);color:#f6efe7;cursor:pointer;font-weight:600}button.g{background:none;color:var(--ink);border:1px solid var(--line);padding:5px 12px;font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;font-size:13.5px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#efe3d6}
.tw{overflow-x:auto}.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#e8d8c9}.tag.active{background:var(--s);color:#fff}.tag.past_due,.tag.ended{background:var(--o)}.tag.disabled{background:var(--ink);color:#fff}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}#msg{color:var(--muted);font-size:13px}
</style></head><body><div class="w">
<h1>Relay admin</h1><p class="sub">Accounts, revenue and failed payments. Keep this page private.</p>
<div class="bar" id="login"><input id="key" type="password" placeholder="Admin key" autocomplete="off"><button id="go">Open</button><span id="msg"></span></div>
<div id="out" hidden>
<div class="k" id="kpis"></div>
<div class="bar"><input id="q" placeholder="Search email, plan or status"><button class="g" id="refresh">Refresh</button></div>
<div class="tw"><table><thead><tr><th>Email</th><th>Plan</th><th>Status</th><th>Card</th><th>Trial ends</th><th>Next payment</th><th>Chats this month</th><th>Failed</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>
<script>
var KEY="",ROWS=[];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function d(t){return t?new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"–"}
async function api(opt){var r=await fetch("/api/admin",Object.assign({headers:{"x-admin-key":KEY,"content-type":"application/json"}},opt||{}));var j=await r.json();if(!r.ok)throw j;return j}
function draw(){var f=$("q").value.toLowerCase();$("rows").innerHTML=ROWS.filter(function(r){return !f||(r.email+" "+r.plan+" "+r.status).toLowerCase().indexOf(f)>-1}).map(function(r){
 return "<tr><td>"+esc(r.email)+"</td><td>"+esc(r.plan)+" ($"+r.price+")</td><td><span class='tag "+esc(r.status)+"'>"+esc(r.status.replace("_"," "))+"</span></td><td>"+(r.last4?"•••• "+esc(r.last4):"–")+"</td><td>"+d(r.trialEnd)+"</td><td>"+d(r.nextBill)+"</td><td>"+r.convMonth+" / "+r.limit+"</td><td>"+r.failed+"</td><td>"+
 (r.status==="disabled"?"<button class='g' data-a='enable' data-c='"+esc(r.code)+"'>Enable</button>":"<button class='g' data-a='disable' data-c='"+esc(r.code)+"'>Disable</button> <button class='g' data-a='stopBilling' data-c='"+esc(r.code)+"'>Stop billing</button>")+"</td></tr>"}).join("")||"<tr><td colspan='9'>No accounts yet.</td></tr>"}
async function load(){try{var j=await api();var s=j.summary;ROWS=j.rows;$("login").hidden=true;$("out").hidden=false;
 $("kpis").innerHTML=[["Monthly revenue","$"+s.mrr,1],["In trial","" +s.trialing+" ($"+s.trialValue+"/mo when they convert)"],["Paying",s.active],["Payment failing",s.pastDue],["Ended or cancelled",s.ended+s.canceled],["All accounts",s.accounts]].map(function(k){return "<div class='c"+(k[2]?" o":"")+"'><b>"+esc(k[1])+"</b><span>"+esc(k[0])+"</span></div>"}).join("");
 draw();sessionStorage.setItem("rk",KEY)}catch(e){$("msg").textContent=(e&&e.error)||"Couldn’t open."}}
$("go").onclick=function(){KEY=$("key").value.trim();load()};$("key").onkeydown=function(e){if(e.key==="Enter")$("go").click()};
$("q").oninput=draw;$("refresh").onclick=load;
$("rows").onclick=async function(e){var b=e.target.closest("button[data-a]");if(!b)return;if(b.dataset.a!=="enable"&&!confirm("Are you sure?"))return;try{await api({method:"POST",body:JSON.stringify({action:b.dataset.a,code:b.dataset.c})});load()}catch(x){alert((x&&x.error)||"Failed")}};
var sk=sessionStorage.getItem("rk");if(sk){KEY=sk;load()}
</script></body></html>
